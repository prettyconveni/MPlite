name: Build & Release MPlite APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (leave empty for auto v1.1.5-<run_number>)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew :app:assembleFullRelease

      - name: Prepare Release APK
        id: prep
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v1.1.5-${{ github.run_number }}"
          fi
          APK_SRC="app/build/outputs/apk/full/release/app-full-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            APK_SRC=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          APK_NAME="MPlite-${TAG}.apk"
          cp "$APK_SRC" "$APK_NAME"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MPlite-APK
          path: ${{ steps.prep.outputs.apk_name }}
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: MPlite ${{ steps.prep.outputs.tag }}
          body: |
            MPlite (`com.system.power`) 自动构建版本。
          files: ${{ steps.prep.outputs.apk_name }}
          make_latest: true

      - name: Upload APK & latest.json to Cloudflare R2
        if: ${{ secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          TAG="${{ steps.prep.outputs.tag }}"
          APK_NAME="${{ steps.prep.outputs.apk_name }}"
          cat <<EOF > latest.json
          [
            {
              "tag_name": "${TAG}",
              "body": "MPlite (\`com.system.power\`) ${TAG}（Cloudflare R2 加速源）。",
              "assets": [
                {
                  "name": "${APK_NAME}",
                  "browser_download_url": "https://cf.616241.xyz/${APK_NAME}"
                }
              ]
            }
          ]
          EOF
          R2_ENDPOINT="https://968fa5f40042abd750ad57132b94eeef.r2.cloudflarestorage.com"
          aws s3 cp "$APK_NAME" "s3://mplite-releases/${APK_NAME}" --endpoint-url "$R2_ENDPOINT"
          aws s3 cp "latest.json" "s3://mplite-releases/latest.json" --endpoint-url "$R2_ENDPOINT" --content-type "application/json" --cache-control "no-cache, max-age=60"
