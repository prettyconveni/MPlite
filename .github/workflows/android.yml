name: Build & Release MPlite APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (leave empty for auto v1.1.1-<run_number>)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew :app:assembleFullRelease

      - name: Prepare Release APK
        id: prep
        run: |
          APK_SRC="app/build/outputs/apk/full/release/app-full-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            APK_SRC=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          cp "$APK_SRC" "MPlite-v1.1.1.apk"
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v1.1.1-${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MPlite-APK
          path: MPlite-v1.1.1.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: MPlite ${{ steps.prep.outputs.tag }}
          body: |
            MPlite (`com.system.power`) 自动构建版本。
          files: MPlite-v1.1.1.apk
          make_latest: true
